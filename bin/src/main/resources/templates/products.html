<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="fragments/layout :: head('Products')"></head><body><div th:replace="fragments/layout :: navbar"></div><main class="container py-5"><h1>Product Catalog</h1><p class="text-muted">Logged in as <span th:text="${session.loggedInUser}"></span></p><div class="table-responsive"><table class="table table-striped table-hover"><thead class="table-dark"><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Description</th></tr></thead><tbody><tr th:each="product : ${products}"><td th:text="${product.id}"></td><td th:text="${product.name}"></td><td th:text="${product.category}"></td><td th:text="${'$' + #numbers.formatDecimal(product.price,1,2)}"></td><td th:text="${product.quantityInStock}"></td><td th:text="${product.description}"></td></tr></tbody></table></div></main><div th:replace="fragments/layout :: footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
