<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="fragments/layout :: head('Login')"></head><body><div th:replace="fragments/layout :: navbar"></div><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-5"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4 text-center">Login</h1><div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert alert-danger" th:if="${loginError}" th:text="${loginError}"></div><form th:action="@{/login}" th:object="${loginModel}" method="post" novalidate><div class="mb-3"><label class="form-label">Username</label><input class="form-control" th:field="*{username}"><div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div></div><div class="mb-4"><label class="form-label">Password</label><input type="password" class="form-control" th:field="*{password}"><div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div></div><button class="btn btn-primary w-100">Login</button></form><p class="text-muted small mt-3 text-center">Demo login: <b>admin</b> / <b>password</b></p></div></div></div></div></main><div th:replace="fragments/layout :: footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
