<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="fragments/layout :: head('Register')"></head><body><div th:replace="fragments/layout :: navbar"></div><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4 text-center">Create Account</h1><form th:action="@{/register}" th:object="${userModel}" method="post" novalidate><div class="row"><div class="col-md-6 mb-3"><label class="form-label">First Name</label><input class="form-control" th:field="*{firstName}"><div class="text-danger small" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div></div><div class="col-md-6 mb-3"><label class="form-label">Last Name</label><input class="form-control" th:field="*{lastName}"><div class="text-danger small" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div></div></div><div class="mb-3"><label class="form-label">Email</label><input class="form-control" th:field="*{email}"><div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div></div><div class="mb-3"><label class="form-label">Phone</label><input class="form-control" th:field="*{phoneNumber}" placeholder="10 digits"><div class="text-danger small" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div></div><div class="mb-3"><label class="form-label">Username</label><input class="form-control" th:field="*{username}"><div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div></div><div class="mb-4"><label class="form-label">Password</label><input type="password" class="form-control" th:field="*{password}"><div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div></div><button class="btn btn-primary w-100">Register</button></form></div></div></div></div></main><div th:replace="fragments/layout :: footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
