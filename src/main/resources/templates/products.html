<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/layout :: head('Products')"></head>

<body>
<div th:replace="fragments/layout :: navbar"></div>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Product Catalog</h1>
            <p class="text-muted">Logged in as <span th:text="${session.loggedInUser}"></span></p>
        </div>

        <a class="btn btn-primary" th:href="@{/products/create}">Create Product</a>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3" th:each="product : ${products}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                    <p class="badge bg-secondary" th:text="${product.category}">Category</p>
                    <p>
                        <strong>Price:</strong>
                        $<span th:text="${#numbers.formatDecimal(product.price, 1, 2)}"></span>
                    </p>
                    <p>
                        <strong>Stock:</strong>
                        <span th:text="${product.quantityInStock}"></span>
                    </p>
                    <p th:text="${product.description}">Description</p>
                </div>
            </div>
        </div>
    </div>

</main>

<div th:replace="fragments/layout :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
